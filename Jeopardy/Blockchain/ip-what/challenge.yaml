name: IP What?
author: rennfurukawa
description: 'IP** is a modular suite of protocols for organizing and transferring data, designed from the ground up with the principles of content addressing and peer-to-peer networking. Because IP** is open-source, there are multiple implementations of IP**. While IP** has more than one use case, its main use case is for publishing data (files, directories, websites, etc.) in a decentralised fashion.


